<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Give Feedback</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard-container">

        <header class="dashboard-header">

            <div>
                <h1>Feedback Hub</h1>
                <p>Submit Feedback</p>
            </div>

            <button onclick="window.location.href='dashboard.html'">
                Dashboard
            </button>

        </header>


        <section class="welcome-section">

            <h2>Give Feedback ⭐</h2>

            <p>
                Share your experience about the course and faculty.
            </p>

        </section>


        <section class="action-section">

            <div class="action-card">

                <form id="feedbackForm">

                    <label>Course</label>

                    <select id="course" required>

                        <option value="">
                            Select Course
                        </option>

                        <option>
                            Python Programming
                        </option>

                        <option>
                            Database Management
                        </option>

                        <option>
                            Artificial Intelligence
                        </option>

                        <option>
                            Web Development
                        </option>

                    </select>


                    <label>Faculty Name</label>

                    <input
                        type="text"
                        id="faculty"
                        placeholder="Enter faculty name"
                        required
                    >


                    <label>Rating</label>

                    <select id="rating" required>

                        <option value="">
                            Select Rating
                        </option>

                        <option value="5">
                            ⭐⭐⭐⭐⭐ Excellent
                        </option>

                        <option value="4">
                            ⭐⭐⭐⭐ Good
                        </option>

                        <option value="3">
                            ⭐⭐⭐ Average
                        </option>

                        <option value="2">
                            ⭐⭐ Needs Improvement
                        </option>

                        <option value="1">
                            ⭐ Poor
                        </option>

                    </select>


                    <label>Comments</label>

                    <textarea
                        id="comments"
                        rows="5"
                        placeholder="Enter your feedback..."
                        required
                    ></textarea>


                    <button type="submit">
                        Submit Feedback
                    </button>

                </form>

                <p id="feedbackMessage"></p>

            </div>

        </section>

    </div>


    <script>

        const feedbackForm =
            document.getElementById("feedbackForm");

        feedbackForm.addEventListener("submit", function(event) {

            event.preventDefault();

            document.getElementById("feedbackMessage").textContent =
                "Feedback submitted successfully!";

            feedbackForm.reset();

        });

    </script>

</body>

</html>
